<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: #333;
    }
    .hint { font-size: 11px; color: #777; margin: 0 0 12px 0; }
    button {
      width: 100%;
      padding: 11px;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: #007AFF;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #9ec6f5; cursor: default; }
    #status {
      margin-top: 12px;
      padding: 9px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #status.info { background: #e3f2fd; color: #1565c0; display: block; }
    #status.success { background: #e8f5e9; color: #2e7d32; display: block; }
    #status.error { background: #ffebee; color: #c62828; display: block; }
  </style>
</head>
<body>
  <h2>Bulk PDF Downloader</h2>
  <p class="hint">Select the invoices on the page, then click below. You'll get one ZIP.</p>
  <button id="downloadBtn">Download selected as ZIP</button>
  <div id="status"></div>
  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
